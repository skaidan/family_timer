<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Familia</p>
          <h1>Family Timer</h1>
        </div>
        <div class="topbar-actions">
          <select id="day-selector" class="pill-button neutral">
            <option value="today">Hoy</option>
            <option value="tomorrow">Mañana</option>
          </select>
          <button id="google-auth-button" class="pill-button neutral">Conectar Google Calendar</button>
          <button id="mode-toggle" class="pill-button">Modo niños</button>
        </div>
        <div id="google-sync-status" class="google-status">Sin conexión a Google Calendar</div>
      </header>

      <main class="timeline-area">
        <div class="timeline-card">
          <div id="time-axis" class="time-axis"></div>
          <div id="rows" class="rows"></div>
          <div id="now-cursor" class="now-cursor"></div>
        </div>
      </main>

      <section class="summary-card">
        <div>
          <p class="eyebrow">Ahora</p>
          <h2 id="current-title">Cargando...</h2>
          <p id="current-description">Preparando la vista visual del día.</p>
          <p id="time-remaining" class="summary-note">Tiempo restante: --</p>
        </div>
        <div class="summary-meta">
          <div>
            <p class="eyebrow">Siguiente</p>
            <strong id="next-title">-</strong>
          </div>
          <div>
            <p class="eyebrow">Libre</p>
            <strong id="free-time">-</strong>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
